name: Update Repository Index

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: update-repo-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Update repository database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_repos.py

      - name: Generate README and web catalog JSON
        run: python3 scripts/generate_readme.py

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.db README.md data/repos.json
          if ! git diff --cached --quiet; then
            REPO_COUNT=$(python3 scripts/get_repo_count.py)
            CURRENT_DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore: update repository index (${REPO_COUNT} public repos, ${CURRENT_DATE})"
            git pull --rebase origin main
            git push origin main
          fi